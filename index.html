<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>avanish qyro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="product-grid">

    <!-- Product 1 -->
    <div class="product-card">
      <div class="product-badge">Hot Drop</div>
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80" alt="QYRO Streetwear Tee">
      <div class="product-info">
        <span class="brand-subtitle">QYRO® Winter</span>
        <h3>Aesthetic Streetwear Fleece Hoodie</h3>
        <div class="rating">(89)</div>
        <div class="size-picker">
          <label>Fit:</label>
          <select id="size-p1">
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L" selected>L</option>
            <option value="XL">XL</option>
          </select>
        </div>
        <a href="#" class="size-chart-link">Size Guide</a>
        <div class="price-container">
          <span class="price">₹1,299</span>
          <span class="original-price">₹2,499</span>
          <span class="discount">48% OFF</span>
        </div>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
      <div class="product-badge">Trending</div>
      <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=600&q=80" alt="QYRO Streetwear Tee">
      <div class="product-info">
        <span class="brand-subtitle">QYRO® Basics</span>
        <h3>Minimalist Drop-Shoulder White Tee</h3>
        <div class="rating">(98)</div>
        <div class="size-picker">
          <label>Fit:</label>
          <select id="size-p2">
            <option value="S">S</option>
            <option value="M" selected>M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
          </select>
        </div>
        <a href="#" class="size-chart-link">Size Guide</a>
        <div class="price-container">
          <span class="price">₹649</span>
          <span class="original-price">₹1,199</span>
          <span class="discount">45% OFF</span>
        </div>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>

  </div>

</body>
</html>
